name: PR Test (Apple MPS providers)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      # target_stage is the job id (e.g. stage-b-e2e-test-mps), distinct from
      # the run_suite.py suite name it dispatches (e.g. stage-b-e2e-mps).
      target_stage:
        description: "Select a stage to run from dropdown (leave empty for auto-detect)"
        required: false
        type: choice
        default: ''
        options:
          - ''
          - stage-a-unit-test-mps
          - stage-b-e2e-test-mps

concurrency:
  group: pr-test-mps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== Check Changes ==================== #
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      changes_exist: ${{ steps.filter.outputs.main_package == 'true'
        || steps.filter.outputs.sgl_kernel == 'true'
        || inputs.target_stage != '' }}
      main_package: ${{ steps.filter.outputs.main_package }}
      sgl_kernel: ${{ steps.filter.outputs.sgl_kernel }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Ignored on pull_request; workflow_dispatch has no PR base without it.
          base: main
          filters: |
            main_package:
              - "python/sglang/!(multimodal_gen|kernels)/**/!(*.md)"
              - "python/sglang/kernels/!(*.md)"
              - "python/sglang/kernels/!(aot)/**/!(*.md)"
              - "python/pyproject_other.toml"
              - "test/**/!(*.md)"
              - ".github/workflows/pr-test-mps.yml"
            sgl_kernel:
              - "python/sglang/kernels/aot/**/!(*.md|THIRDPARTYNOTICES.txt|LICENSE)"
              - ".github/workflows/pr-test-mps.yml"

  # ==================== PR Gate ==================== #
  pr-gate:
    needs: check-changes
    if: needs.check-changes.outputs.changes_exist == 'true'
    uses: ./.github/workflows/pr-gate.yml
    secrets: inherit

  stage-a-unit-test-mps:
    needs: [check-changes, pr-gate]
    # !cancelled() lets dispatch past a skipped pr-gate; the pull_request
    # path still requires pr-gate success, keeping the run-ci gate intact.
    if: |
      !cancelled() && (
        (needs.pr-gate.result == 'success' &&
          (needs.check-changes.outputs.main_package == 'true' ||
           needs.check-changes.outputs.sgl_kernel == 'true')) ||
        (github.event_name == 'workflow_dispatch' &&
         inputs.target_stage == 'stage-a-unit-test-mps')
      )
    runs-on: macos-26
    timeout-minutes: 60
    env:
      SGLANG_IS_IN_CI: true
      # Forbid HF downloads to enforce the model-free guarantee.
      HF_HUB_OFFLINE: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'python/pyproject_other.toml'

      - name: Verify Apple Silicon runner
        run: |
          echo "uname -m: $(uname -m)"
          python3 -c "import platform; assert platform.machine()=='arm64', platform.machine(); print('machine:', platform.machine(), 'system:', platform.system())"

      - name: Install MPS backend dependencies
        timeout-minutes: 30
        run: |
          test -f python/pyproject_other.toml || { echo "alt pyproject_other.toml missing"; exit 1; }
          # Swap in the Apple Silicon pyproject; srt_mps skips the all_mps diffusion chain.
          rm -f python/pyproject.toml
          mv python/pyproject_other.toml python/pyproject.toml
          uv venv
          uv pip install setuptools wheel
          xcrun -find metal
          metal_dist=$(mktemp -d "$RUNNER_TEMP/sgl-metal-dist.XXXXXX")
          uv run python python/sglang/kernels/aot/setup_metal.py bdist_wheel --dist-dir "$metal_dist"
          metal_wheel=$(find "$metal_dist" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$metal_wheel" || { echo "Metal wheel was not built"; exit 1; }
          case "$(basename "$metal_wheel")" in
            *-py3-none-macosx_14_0_arm64.whl) ;;
            *) echo "Metal wheel must be Python-agnostic macOS 14 arm64: $metal_wheel"; exit 1 ;;
          esac
          uv pip install --force-reinstall "$metal_wheel"
          uv pip install -e "python[srt_mps,test]"

      - name: Verify MPS runtime and operator capabilities
        run: |
          uv run python -c "import mlx.core as mx, torch; from sgl_kernel.metal import is_metal_aot_available, warmup_qwen3_06b_metal_aot; assert torch.backends.mps.is_available(), 'PyTorch MPS is unavailable'; assert mx.metal.is_available(), 'MLX Metal is unavailable'; assert callable(getattr(torch.mps, 'compile_shader', None)), 'torch.mps.compile_shader is unavailable'; assert callable(getattr(torch.mps, 'load_metallib', None)), 'torch.mps.load_metallib is unavailable'; assert is_metal_aot_available(), 'packaged Metal AOT library is unavailable'; warmup_qwen3_06b_metal_aot(); print('torch', torch.__version__, 'mlx', mx.__version__, 'MPS/Metal JIT+AOT: available')"

      - name: Run model-free MPS semantic-operator unit tests
        timeout-minutes: 15
        run: |
          uv run python test/run_suite.py --hw mps --suite stage-a-unit-test-mps

  stage-b-e2e-test-mps:
    needs: [check-changes, pr-gate]
    # Manual-only: no self hosted Apple Silicon runner is generally available; hosted runners are too small for e2e.
    if: |
      !cancelled() && inputs.target_stage == 'stage-b-e2e-test-mps'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    env:
      SGLANG_IS_IN_CI: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: 'python/pyproject_other.toml'

      - name: Verify Apple Silicon runner
        run: |
          echo "uname -m: $(uname -m)"
          python3 -c "import platform; assert platform.machine()=='arm64', platform.machine(); print('machine:', platform.machine(), 'system:', platform.system())"

      - name: Install MPS backend dependencies
        timeout-minutes: 30
        run: |
          test -f python/pyproject_other.toml || { echo "alt pyproject_other.toml missing"; exit 1; }
          rm -f python/pyproject.toml
          mv python/pyproject_other.toml python/pyproject.toml
          uv venv --python 3.11
          uv pip install setuptools wheel
          xcrun -find metal
          metal_dist=$(mktemp -d "$RUNNER_TEMP/sgl-metal-dist.XXXXXX")
          uv run python python/sglang/kernels/aot/setup_metal.py bdist_wheel --dist-dir "$metal_dist"
          metal_wheel=$(find "$metal_dist" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$metal_wheel" || { echo "Metal wheel was not built"; exit 1; }
          case "$(basename "$metal_wheel")" in
            *-py3-none-macosx_14_0_arm64.whl) ;;
            *) echo "Metal wheel must be Python-agnostic macOS 14 arm64: $metal_wheel"; exit 1 ;;
          esac
          uv pip install --force-reinstall "$metal_wheel"
          uv pip install -e "python[srt_mps,test]"

      - name: Verify MPS runtime and operator capabilities
        run: |
          uv run python -c "import mlx.core as mx, torch; from sgl_kernel.metal import is_metal_aot_available, warmup_qwen3_06b_metal_aot; assert torch.backends.mps.is_available(), 'PyTorch MPS is unavailable'; assert mx.metal.is_available(), 'MLX Metal is unavailable'; assert callable(getattr(torch.mps, 'compile_shader', None)), 'torch.mps.compile_shader is unavailable'; assert callable(getattr(torch.mps, 'load_metallib', None)), 'torch.mps.load_metallib is unavailable'; assert is_metal_aot_available(), 'packaged Metal AOT library is unavailable'; warmup_qwen3_06b_metal_aot(); print('torch', torch.__version__, 'mlx', mx.__version__, 'MPS/Metal JIT+AOT: available')"

      # Needs a warm Qwen3-0.6B cache or network. The test serially exercises
      # whole-model MLX, Torch with Metal semantic ops, and all-Torch reference.
      - name: Run MPS provider-plan e2e cache test
        timeout-minutes: 90
        run: |
          uv run python test/run_suite.py --hw mps --suite stage-b-e2e-mps

  pr-test-mps-finish:
    needs:
      [
        pr-gate,
        check-changes,
        stage-a-unit-test-mps,
        stage-b-e2e-test-mps,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check all dependent job statuses
        run: |
          json_needs='${{ toJson(needs) }}'
          job_names=$(echo "$json_needs" | jq -r 'keys_unsorted[]')
          for job in $job_names; do
            result=$(echo "$json_needs" | jq -r --arg j "$job" '.[$j].result')
            echo "$job: $result"
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "The above jobs failed."
              exit 1
            fi
          done
          echo "All jobs completed successfully"
